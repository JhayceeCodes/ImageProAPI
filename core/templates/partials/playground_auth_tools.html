<section class="rounded-md border border-line bg-white p-6 shadow-soft">
    <h2 class="text-xl font-bold text-slate-950">Authentication tools</h2>
    <p class="mt-2 text-sm leading-7 text-slate-600">
        Register and log in here if you want an access token for higher upload limits.
    </p>

    <form id="register-form" class="mt-5 space-y-4">
        <h3 class="text-sm font-semibold uppercase tracking-[0.2em] text-slate-500">Register</h3>
        <div>
            <label for="register-username" class="block text-sm font-semibold text-slate-950">Username</label>
            <input id="register-username" name="username" type="text" class="mt-2 w-full rounded-md border border-slate-300 px-3 py-2.5 text-sm outline-none transition focus:border-slate-500 focus:ring-4 focus:ring-slate-200">
        </div>
        <div>
            <label for="register-email" class="block text-sm font-semibold text-slate-950">Email</label>
            <input id="register-email" name="email" type="email" class="mt-2 w-full rounded-md border border-slate-300 px-3 py-2.5 text-sm outline-none transition focus:border-slate-500 focus:ring-4 focus:ring-slate-200">
        </div>
        <div>
            <label for="register-password" class="block text-sm font-semibold text-slate-950">Password</label>
            <input id="register-password" name="password" type="password" class="mt-2 w-full rounded-md border border-slate-300 px-3 py-2.5 text-sm outline-none transition focus:border-slate-500 focus:ring-4 focus:ring-slate-200">
        </div>
        <button type="submit" class="rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 transition hover:border-slate-400 hover:text-slate-950">
            Register
        </button>
    </form>

    <form id="login-form" class="mt-8 space-y-4 border-t border-line pt-6">
        <h3 class="text-sm font-semibold uppercase tracking-[0.2em] text-slate-500">Login</h3>
        <div>
            <label for="login-username" class="block text-sm font-semibold text-slate-950">Username</label>
            <input id="login-username" name="username" type="text" class="mt-2 w-full rounded-md border border-slate-300 px-3 py-2.5 text-sm outline-none transition focus:border-slate-500 focus:ring-4 focus:ring-slate-200">
        </div>
        <div>
            <label for="login-password" class="block text-sm font-semibold text-slate-950">Password</label>
            <input id="login-password" name="password" type="password" class="mt-2 w-full rounded-md border border-slate-300 px-3 py-2.5 text-sm outline-none transition focus:border-slate-500 focus:ring-4 focus:ring-slate-200">
        </div>
        <button type="submit" class="rounded-md bg-slate-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-slate-800">
            Log in
        </button>
    </form>
</section>
